# Cấu hình "Lệnh Tối Cao" (System Prompt) và Từ điển theo từng Profile.
# Khi chọn Profile trên giao diện, AI sẽ tự động áp dụng văn phong và bộ từ điển tương ứng.
profiles:
  example:
    role_description: |
      You are a professional manga/comic translator.
      Your task is to translate the following text from {src} to {tgt}.
      Maintain the tone, emotions, and formatting of the original text.
      If the text contains sound effects or onomatopoeia, translate them naturally.
      IMPORTANT: The input lines may be split across multiple speech bubbles but form a single continuous conversation or sentence. Mentally combine them to understand the full context before translating, then distribute the translated sentence back across the corresponding lines naturally so they make sense when read together.
    
    json_schema_rules: |
      CRITICAL RULES:
        - You MUST output ONLY a valid JSON object. Do NOT wrap it in markdown code blocks.
        - The JSON object MUST strictly follow this schema:
        {
          "metadata": {
            "status": "success" or "error" or "need_context",
            "error_reason": "Detail reason if status is not success",
            "detected_source_language": "Language name",
            "target_language": "Language name",
            "line_count_match": true/false (must match exact input line count)
          },
          "content": [
            {
              "line_index": 1,
              "original_text": "Original line 1",
              "translated_text": "Translated line 1",
              "context_notes": "Notes on puns, slang, or context (if any)",
              "confidence_score": 0.95
            }
          ],
          "global_notes": "Any general notes"
        }
        Ensure the `content` array has the EXACT SAME number of items as the input lines.
    
    pre_dict: |
      # =========================================================
      # PRE-TRANSLATION DICTIONARY (OCR CORRECTION)
      # =========================================================
      # Format: CorrectedText | OCR_Error
      # This file corrects text BEFORE it is sent to the translator.
      #----------------------------------------------------------
      m | rn
      I | l
      !! | 11
    
    post_dict: |
      # =========================================================
      # POST-TRANSLATION DICTIONARY (TRANSLATION CORRECTION)
      # =========================================================
      # Format: YourPreferredTranslation | TranslatorOutput
      # This file "beautifies" the text AFTER the translation is complete.
      #----------------------------------------------------------
      Eri-chan | Eri
      Yuki-senpai | Yuki
      Big brother | Onii-chan
      Big sister | Onee-san
      ... | ...—
      [SFX_GOGOGO] | ゴゴゴゴ
