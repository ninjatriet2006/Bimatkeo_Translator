        type: integer
      ignore_bubble:
        default: 0
        title: Ignore Bubble
        type: integer
      prob:
        anyOf:
          - type: number
          - type: 'null'
        default: null
        title: Prob
    title: OcrConfig
    type: object
  InpaintPrecision:
    title: InpaintPrecision
    type: string
  Inpainter:
    title: Inpainter
    type: string
  InpainterConfig:
    properties:
      inpainter:
        allOf:
          - $ref: '#/$defs/Inpainter'
