        type: number
      unclip_ratio:
        default: 2.3
        title: Unclip Ratio
        type: number
    title: DetectorConfig
    type: object
  Ocr:
    title: Ocr
    type: string
  OcrConfig:
    properties:
      use_mocr_merge:
        default: false
        title: Use Mocr Merge
        type: boolean
      ocr:
        allOf:
          - $ref: '#/$defs/Ocr'
        default: none
      min_text_length:
        default: 0
