          - $ref: '#/$defs/Alignment'
        default: auto
      disable_font_border:
        default: false
        title: Disable Font Border
        type: boolean
      outline_color:
        anyOf:
          - type: string
          - type: 'null'
        default: FFFFFF
        title: Outline Color
      outline_width:
        default: 2
        title: Outline Width
        type: integer
      is_bold:
        default: false
        title: Is Bold
        type: boolean
      font_size_offset:
        default: 0
        title: Font Size Offset
        type: integer
      font_size_minimum:
        default: -1
        title: Font Size Minimum
        type: integer
      direction:
        allOf:
          - $ref: '#/$defs/Direction'
        default: auto
      uppercase:
        default: false
        title: Uppercase
        type: boolean
      lowercase:
        default: false
        title: Lowercase
        type: boolean
      gimp_font:
        default: Sans-serif
        title: Gimp Font
        type: string
      no_hyphenation:
        default: false
        title: No Hyphenation
        type: boolean
      font_color:
        anyOf:
          - type: string
          - type: 'null'
        default: null
        title: Font Color
      line_spacing:
        anyOf:
          - type: integer
          - type: 'null'
        default: null
        title: Line Spacing
      font_size:
        anyOf:
          - type: integer
          - type: 'null'
        default: null
        title: Font Size
      rtl:
        default: true
        title: Rtl
        type: boolean
    title: RenderConfig
    type: object
  Detector:
    title: Detector
    type: string
  DetectorConfig:
    properties:
      detector:
        allOf:
          - $ref: '#/$defs/Detector'
        default: none
      detection_size:
        default: 2048
        title: Detection Size
        type: integer
      text_threshold:
        default: 0.5
        title: Text Threshold
        type: number
      det_rotate:
        default: false
        title: Det Rotate
        type: boolean
      det_auto_rotate:
        default: false
        title: Det Auto Rotate
        type: boolean
      det_invert:
        default: false
        title: Det Invert
        type: boolean
      det_gamma_correct:
        default: false
        title: Det Gamma Correct
        type: boolean
      box_threshold:
        default: 0.7
