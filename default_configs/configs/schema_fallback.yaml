        type: boolean
      skip_lang:
        anyOf:
          - type: string
          - type: 'null'
        default: null
        title: Skip Lang
      gpt_config:
        anyOf:
          - type: string
          - type: 'null'
        default: null
        title: Gpt Config
      translator_chain:
        anyOf:
          - type: string
          - type: 'null'
        default: null
        title: Translator Chain
      selective_translation:
        anyOf:
          - type: string
          - type: 'null'
        default: null
