# ========================================================================
# CRITICAL RULE FOR AI AGENTS (e.g. Gemini, GPT):
# DO NOT USE FLAT DICTIONARIES FOR THIS FILE!
# DO NOT ADD 'group' OR 'order' FIELDS TO ANY WIDGET!
# This configuration uses a NESTED structure. The UI Tabs are the root keys
# (e.g., 'General & Translator'). All widgets must be nested directly inside
# their respective tab. The rendering order is strictly top-to-bottom natively.
# ========================================================================
ui_map:
  General & Translator:
    processing_device:
      widget: segmented_button
      default: CPU
      values:
      - CPU
      - NVIDIA GPU
    target_lang:
      widget: optionmenu_languages
      default: none
    translator_category:
      widget: segmented_button
      default: Offline
      values:
      - Offline
      - AI / Online
    ai_mode:
      widget: segmented_button
      default: Standalone API
      values:
      - Standalone API
      - Pool APIs
    pool_name:
      widget: pool_profile_selector
      default: ''
      service: Translator
    api_name:
      widget: api_profile_selector
      default: ''
      service: Translator
    offline_translator:
      widget: optionmenu
    ai_translator:
      widget: optionmenu
    ai_endpoint:
      widget: entry
      placeholder: e.g., https://api.openai.com/v1
    ai_model:
      widget: ai_model_selector
      default: ''
      button_text: Fetch
      placeholder: e.g., gemini-2.5-flash
    enable_translator_chain:
      widget: checkbox
      default: false
    ai_key:
      widget: entry
      default: ''
      placeholder: Enter your API key
    max_retries:
      widget: spinbox
      default: 3
      min: 0
      max: 10
    translator_chain:
      widget: translator_chain_builder
      default: ''
    merge_nearby_boxes:
      widget: checkbox
      default: false
      section: advanced
    no_text_lang_skip:
      widget: checkbox
      default: false
      section: advanced
    max_request_length:
      widget: spinbox
      default: 2000
      min: -1
      max: 999999
    system_prompt_profile:
      widget: optionmenu
    skip_lang:
      widget: open_yaml_button
      default: Ignored.yaml
      section: advanced
  Detector & OCR:
    ocr_category:
      widget: segmented_button
      default: Offline
      values:
      - Offline
      - AI / Online
    offline_detector:
      widget: optionmenu
    detection_size:
      widget: spinbox
      recommendation: true
      default: 2048
      min: 1
      max: 999999
    offline_ocr:
      widget: optionmenu
      default: none
    ocr_ai_mode:
      widget: segmented_button
      default: Standalone API
      values:
      - Standalone API
      - Pool APIs
    ocr_pool_name:
      widget: pool_profile_selector
      default: ''
      service: OCR
    ocr_api_name:
      widget: api_profile_selector
      default: ''
      service: OCR
    api_ocr:
      widget: optionmenu
    ocr_api_endpoint:
      widget: entry
      placeholder: e.g., https://api.openai.com/v1
    ocr_api_model:
      widget: ai_model_selector
      default: ''
      button_text: Fetch
      placeholder: e.g., gemini-2.5-flash
    ocr_api_key:
      widget: entry
      default: ''
      placeholder: Enter your API key
    ignore_bubble:
      widget: slider
      default: 0
      options:
        from_: 0
        to: 500
        number_of_steps: 50
      value_format: '{:.0f}'
    text_threshold:
      widget: slider
      default: 0.5
      options:
        from_: 10
        to: 90
      value_multiplier: 0.01
      value_format: '{:.2f}'
      section: advanced
    box_threshold:
      widget: slider
      default: 0.7
      options:
        from_: 10
        to: 90
      value_multiplier: 0.01
      value_format: '{:.2f}'
      section: advanced
    unclip_ratio:
      widget: slider
      default: 2.3
      options:
        from_: 10
        to: 50
      value_multiplier: 0.1
      value_format: '{:.1f}'
      section: advanced
    det_rotate:
      widget: checkbox
      default: false
      section: advanced
    det_auto_rotate:
      widget: checkbox
      default: false
      section: advanced
    det_invert:
      widget: checkbox
      default: false
      section: advanced
    det_gamma_correct:
      widget: slider
      default: 1.0
      options:
        from_: 1
        to: 30
      value_multiplier: 0.1
      value_format: '{:.1f}'
      section: advanced
    min_text_length:
      widget: slider
      default: 0
      section: advanced
      options:
        from_: 0
        to: 10
        number_of_steps: 10
      value_format: '{:.0f}'
    filter_text:
      widget: open_yaml_button
      default: Ignored.yaml
    prob:
      widget: entry
      default:
      section: advanced
      placeholder: 'e.g., 0.85 (default: auto)'
  Image & Inpainter:
    inpainter:
      widget: optionmenu
    enable_advanced_diffusion:
      widget: checkbox
      default: false
      section: advanced
    diffusion_model:
      widget: optionmenu
      section: advanced
    sd_base_model:
      widget: optionmenu
      section: advanced
    enable_upscaler:
      widget: checkbox
      default: false
    upscaler:
      widget: optionmenu
    upscale_ratio:
      widget: optionmenu
      default: "2"
      values:
      - "1"
      - "2"
      - "3"
      - "4"
    inpainting_precision:
      widget: optionmenu
      default: bf16
    inpainting_size:
      widget: spinbox
      recommendation: true
      default: 2048
      min: 1
      max: 999999
  Render & Output:
    renderer:
      widget: optionmenu
    font_family:
      widget: combobox_fonts
      default: Sans-serif
    font_color:
      widget: entry_with_button
      default: '000000'
      button_text: '...'
    outline_color:
      widget: entry_with_button
      default: 'FFFFFF'
      button_text: '...'
    outline_width:
      widget: slider
      default: 2
      options:
        from_: 0
        to: 10
      value_format: '{:.0f}'
    is_bold:
      widget: checkbox
      default: false
    alignment:
      widget: optionmenu
      default: auto
    font_size_offset:
      widget: slider
      default: 0
      options:
        from_: -20
        to: 20
      value_format: '{:.0f}'
    font_size:
      widget: slider
      default:
      options:
        from_: 0
        to: 150
      value_format: '{:.0f}'
      section: advanced
    line_spacing:
      widget: slider
      default:
      options:
        from_: 0
        to: 30
      value_format: '{:.0f}'
      section: advanced
    direction:
      widget: optionmenu
      default: 'Horizontal: Right-to-Left'
      values:
      - 'Horizontal: Right-to-Left'
      - 'Horizontal: Left-to-Right'
      - 'Vertical: Right-to-Left'
      - 'Vertical: Left-to-Right'
      section: advanced
    disable_font_border:
      widget: checkbox
      default: false
      section: advanced
    uppercase:
      widget: checkbox
      default: false
      section: advanced
    lowercase:
      widget: checkbox
      default: false
      section: advanced
    font_size_minimum:
      widget: slider
      default: -1
      options:
        from_: -1
        to: 40
        number_of_steps: 41
      value_format: '{:.0f}'
      section: advanced
  Output & Export:
    output_format:
      widget: optionmenu
      default: png
      values:
      - png
      - jpg
      - webp
      - pdf
      - psd
      - xcf
    export_mode:
      widget: optionmenu
      default: Create New Folder (Avoid Overwrite)
      values:
      - Create New Folder (Avoid Overwrite)
      - Create New Folder (Overwrite Existing)
      - Translate In-Place (Modify Original)
  Extra Settings:
    memory_mode:
      widget: optionmenu
      default: RAM
      values:
      - RAM
      - DISK
    context_window:
      widget: spinbox
      default: 10
      options:
        from_: 1
        to: 50
        step: 1
    stride_window:
      widget: spinbox
      default: 5
      options:
        from_: 1
        to: 50
        step: 1
    enable_double_check:
      widget: optionmenu
      default: 'Yes'
      values:
      - 'Yes'
      - 'No'
    preset_manager:
      widget: preset_manager
    api_key_manager:
      widget: api_key_manager
    app_language:
      widget: optionmenu
      default: English
      values:
      - English
      - Tiếng Việt
    enable_verbose_output:
      widget: checkbox
      default: false
      tooltip_color: red


schema_cache:
  $defs:
    Alignment:
      title: Alignment
      type: string
    Colorizer:
      enum:
      - none
      - mc2
      title: Colorizer
      type: string
    ColorizerConfig:
      properties:
        colorization_size:
          default: 576
          title: Colorization Size
          type: integer
        denoise_sigma:
          default: 30
          title: Denoise Sigma
          type: integer
        colorizer:
          allOf:
          - $ref: '#/$defs/Colorizer'
          default: none
      title: ColorizerConfig
      type: object
    Detector:
      enum:
      - default
      - dbconvnext
      - ctd
      - craft
      - paddle
      - none
      title: Detector
      type: string
    DetectorConfig:
      properties:
        detector:
          allOf:
          - $ref: '#/$defs/Detector'
          default: none
        detection_size:
          default: 2048
          title: Detection Size
          type: integer
        text_threshold:
          default: 0.5
          title: Text Threshold
          type: number
        det_rotate:
          default: false
          title: Det Rotate
          type: boolean
        det_auto_rotate:
          default: false
          title: Det Auto Rotate
          type: boolean
        det_invert:
          default: false
          title: Det Invert
          type: boolean
        det_gamma_correct:
          default: false
          title: Det Gamma Correct
          type: boolean
        box_threshold:
          default: 0.7
          title: Box Threshold
          type: number
        unclip_ratio:
          default: 2.3
          title: Unclip Ratio
          type: number
      title: DetectorConfig
      type: object
    Direction:
      title: Direction
      type: string
    InpaintPrecision:
      title: InpaintPrecision
      type: string
    Inpainter:
      enum:
      - default
      - lama_large
      - lama_mpe
      - sd
      - none
      - original
      title: Inpainter
      type: string
    InpainterConfig:
      properties:
        inpainter:
          allOf:
          - $ref: '#/$defs/Inpainter'
          default: none
        inpainting_size:
          default: 2048
          title: Inpainting Size
          type: integer
        inpainting_precision:
          allOf:
          - $ref: '#/$defs/InpaintPrecision'
          default: bf16
      title: InpainterConfig
      type: object
    Ocr:
      enum:
      - 32px
      - 48px
      - 48px_ctc
      - mocr
      title: Ocr
      type: string
    OcrConfig:
      properties:
        merge_nearby_boxes:
          default: false
          title: Merge Nearby Text
          type: boolean
        ocr:
          allOf:
          - $ref: '#/$defs/Ocr'
          default: none
        min_text_length:
          default: 0
          title: Min Text Length
          type: integer
        ignore_bubble:
          default: 0
          title: Ignore Bubble
          type: integer
        prob:
          anyOf:
          - type: number
          - type: 'null'
          default:
          title: Prob
      title: OcrConfig
      type: object
    RenderConfig:
      properties:
        renderer:
          allOf:
          - $ref: '#/$defs/Renderer'
          default: none
        alignment:
          allOf:
          - $ref: '#/$defs/Alignment'
          default: auto
        disable_font_border:
          default: false
          title: Disable Font Border
          type: boolean
        font_size_offset:
          default: 0
          title: Font Size Offset
          type: integer
        font_size_minimum:
          default: -1
          title: Font Size Minimum
          type: integer
        direction:
          allOf:
          - $ref: '#/$defs/Direction'
          default: auto
        uppercase:
          default: false
          title: Uppercase
          type: boolean
        lowercase:
          default: false
          title: Lowercase
          type: boolean
        gimp_font:
          default: Sans-serif
          title: Gimp Font
          type: string
        no_hyphenation:
          default: false
          title: No Hyphenation
          type: boolean
        font_color:
          anyOf:
          - type: string
          - type: 'null'
          default:
          title: Font Color
        line_spacing:
          anyOf:
          - type: integer
          - type: 'null'
          default:
          title: Line Spacing
        font_size:
          anyOf:
          - type: integer
          - type: 'null'
          default:
          title: Font Size
        rtl:
          default: true
          title: Rtl
          type: boolean
      title: RenderConfig
      type: object
    Renderer:
      title: Renderer
      type: string
    Translator:
      enum:
      - youdao
      - baidu
      - deepl
      - papago
      - caiyun
      - chatgpt
      - chatgpt_2stage
      - none
      - original
      - sakura
      - deepseek
      - groq
      - gemini
      - gemini_2stage
      - custom_openai
      - offline
      - nllb
      - nllb_big
      - sugoi
      - jparacrawl
      - jparacrawl_big
      - m2m100
      - m2m100_big
      - mbart50
      - qwen2
      - qwen2_big
      title: Translator
      type: string
    TranslatorConfig:
      properties:
        translator:
          allOf:
          - $ref: '#/$defs/Translator'
          default: none
        target_lang:
          default: ENG
          title: Target Lang
          type: string
        no_text_lang_skip:
          default: false
          title: No Text Lang Skip
          type: boolean
        skip_lang:
          anyOf:
          - type: string
          - type: 'null'
          default:
          title: Skip Lang
        gpt_config:
          anyOf:
          - type: string
          - type: 'null'
          default:
          title: Gpt Config
        translator_chain:
          anyOf:
          - type: string
          - type: 'null'
          default:
          title: Translator Chain
        selective_translation:
          anyOf:
          - type: string
          - type: 'null'
          default:
          title: Selective Translation
        enable_post_translation_check:
          default: true
          title: Enable Post Translation Check
          type: boolean
        post_check_max_retry_attempts:
          default: 3
          title: Post Check Max Retry Attempts
          type: integer
        post_check_repetition_threshold:
          default: 20
          title: Post Check Repetition Threshold
          type: integer
        post_check_target_lang_threshold:
          default: 0.5
          title: Post Check Target Lang Threshold
          type: number
      title: TranslatorConfig
      type: object
    UpscaleConfig:
      properties:
        upscaler:
          allOf:
          - $ref: '#/$defs/Upscaler'
          default: none
        revert_upscaling:
          default: false
          title: Revert Upscaling
          type: boolean
        upscale_ratio:
          anyOf:
          - type: integer
          - type: 'null'
          default:
          title: Upscale Ratio
      title: UpscaleConfig
      type: object
    Upscaler:
      enum:
      - waifu2x
      - esrgan
      - 4xultrasharp
      title: Upscaler
      type: string
  properties:
    filter_text:
      anyOf:
      - type: string
      - type: 'null'
      default:
      title: Filter Text
    render:
      allOf:
      - $ref: '#/$defs/RenderConfig'
      default:
        renderer: none
        alignment: auto
        disable_font_border: false
        font_size_offset: 0
        font_size_minimum: -1
        direction: auto
        uppercase: false
        lowercase: false
        gimp_font: Sans-serif
        no_hyphenation: false
        font_color:
        line_spacing:
        font_size:
        rtl: true
    upscale:
      allOf:
      - $ref: '#/$defs/UpscaleConfig'
      default:
        upscaler: none
        revert_upscaling: false
        upscale_ratio:
    translator:
      allOf:
      - $ref: '#/$defs/TranslatorConfig'
      default:
        translator: none
        target_lang: ENG
        no_text_lang_skip: false
        skip_lang:
        gpt_config:
        translator_chain:
        selective_translation:
        enable_post_translation_check: true
        post_check_max_retry_attempts: 3
        post_check_repetition_threshold: 20
        post_check_target_lang_threshold: 0.5
    detector:
      allOf:
      - $ref: '#/$defs/DetectorConfig'
      default:
        detector: none
        detection_size: 2048
        text_threshold: 0.5
        det_rotate: false
        det_auto_rotate: false
        det_invert: false
        det_gamma_correct: false
        box_threshold: 0.7
        unclip_ratio: 2.3
    colorizer:
      allOf:
      - $ref: '#/$defs/ColorizerConfig'
      default:
        colorization_size: 576
        denoise_sigma: 30
        colorizer: none
    inpainter:
      allOf:
      - $ref: '#/$defs/InpainterConfig'
      default:
        inpainter: none
        inpainting_size: 2048
        inpainting_precision: bf16
    ocr:
      allOf:
      - $ref: '#/$defs/OcrConfig'
      default:
        merge_nearby_boxes: false
        ocr: none
        min_text_length: 0
        ignore_bubble: 0
        prob:
    force_simple_sort:
      default: false
      title: Force Simple Sort
      type: boolean
    kernel_size:
      default: 3
      title: Kernel Size
      type: integer
    mask_dilation_offset:
      default: 20
      title: Mask Dilation Offset
      type: integer
  title: Config
  type: object

