# ========================================================================
# [AI_ARCH_NOTE]: MODEL REGISTRY
# - Purpose: Central registry mapping models to their physical files and metadata.
# - Structure: Nested. 'fields' MUST be strictly nested under exact UI Tab Names.
# - Consumed by: app/core/config_loader.py, desktop_ui/mainwindow/handlers.py
# - Modified by: Developers adding new models.
# - Critical Rules: DO NOT USE FLAT DICTIONARIES FOR THE 'fields' SECTION!
# ========================================================================
schema_version: 2

global_settings:
  resources:
    google_font_metadata: "https://cdn.jsdelivr.net/npm/google-font-metadata/data/google-fonts-v2.json"
    google_font_css: "https://fonts.googleapis.com/css?family="
    paddle_en_dict: "https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/main/ppocr/utils/en_dict.txt"

  model_priority_keywords:
    high: ["gpt-4o", "o1", "o3", "deepseek-chat", "mixtral", "llama3"]
    medium: ["gpt-4", "deepseek", "llama"]
    low: ["gpt-3.5"]
    fallback_weight: 5

required_fields:
- offline_detector
- offline_ocr
- inpainter

fields:
  General & Translator:
    offline_translator:
    - key: m2m100
      check_file: models/Offline Translator/M2M100/sentencepiece.model
    - key: m2m100_big
      check_file: models/Offline Translator/M2M100/model.bin
    - key: nllb
      check_file: models/Offline Translator/NLLB/pytorch_model.bin
      source: "hf://facebook/nllb-200-distilled-600M"
    - key: nllb_big
      check_file: models/Offline Translator/NLLB/pytorch_model.bin
      source: "hf://facebook/nllb-200-distilled-1.3B"
    - key: mbart50
      check_file: models/Offline Translator/MBart50/pytorch_model.bin
      source: "hf://facebook/mbart-large-50-many-to-many-mmt"
    - key: jparacrawl
      check_file: models/Offline Translator/JParaCrawl/spm.ja.nopretok.model
    - key: jparacrawl_big
      check_file: models/Offline Translator/JParaCrawl/spm.ja.nopretok.model
    - key: qwen2
      check_file: models/Offline Translator/Qwen2/model.safetensors
      source: "hf://Qwen/Qwen2-7B-Instruct"
    - key: qwen2_big
      check_file: models/Offline Translator/Qwen2/model.safetensors
      source: "hf://Qwen/Qwen2-72B-Instruct"
    - key: offline
      check_file: models/Offline Translator/M2M100/sentencepiece.model

    ai_translator:
    - key: gemini
      check_file: app/plugins/translator/gemini_impl.py
      default_endpoint: "https://generativelanguage.googleapis.com"
      endpoint_inference: ["generativelanguage"]
    - key: deepseek
      check_file: app/plugins/translator/openai_impl.py
      default_endpoint: "https://api.deepseek.com"
      endpoint_inference: []
    - key: groq
      check_file: app/plugins/translator/openai_impl.py
      default_endpoint: "https://api.groq.com/openai/v1"
      endpoint_inference: []
    - key: openai
      check_file: app/plugins/translator/openai_impl.py
      default_endpoint: "https://api.openai.com/v1"
      endpoint_inference: []
    - key: custom_openai
      check_file: app/plugins/translator/openai_impl.py
      endpoint_inference: []
    - key: felo
      check_file: app/plugins/translator/felo_impl.py
      default_endpoint: "https://api.felo.ai/v1"
      endpoint_inference: ["felo.ai"]
  Detector & OCR:
    offline_ocr:
    - key: 32px
      check_file: models/OCR/32px/alphabet-all-v7.txt
    - key: 48px
      check_file: models/OCR/48px/ocr_ar_48px.ckpt
    - key: 48px_ctc
      check_file: models/OCR/48px_ctc/mit48pxctc_ocr.onnx
      source: "hf://banned404/mit48pxctc-ocr-onnx"

    - key: paddle_onnx_rec_v6_tiny
      check_file: models/OCR/Paddle_ONNX_Rec/Tiny/inference.onnx
      source: "hf://PaddlePaddle/PP-OCRv6_tiny_rec_onnx@inference.onnx"
    - key: paddle_onnx_rec_v6_small
      check_file: models/OCR/Paddle_ONNX_Rec/Small/inference.onnx
      source: "hf://PaddlePaddle/PP-OCRv6_small_rec_onnx@inference.onnx"
    - key: paddle_onnx_rec_v6_medium
      check_file: models/OCR/Paddle_ONNX_Rec/Medium/inference.onnx
      source: "hf://PaddlePaddle/PP-OCRv6_medium_rec_onnx@inference.onnx"

    offline_detector:
    - key: dbconvnext
      check_file: models/Detector/DBConvNeXt/dbnet_convnext.ckpt
    - key: craft
      check_file: models/Detector/CRAFT/craft_mlt_25k.pth

    - key: paddle_onnx_v6_tiny
      check_file: models/Detector/Paddle_ONNX/Tiny/inference.onnx
      source: "hf://PaddlePaddle/PP-OCRv6_tiny_det_onnx@inference.onnx"
    - key: paddle_onnx_v6_small
      check_file: models/Detector/Paddle_ONNX/Small/inference.onnx
      source: "hf://PaddlePaddle/PP-OCRv6_small_det_onnx@inference.onnx"
    - key: paddle_onnx_v6_medium
      check_file: models/Detector/Paddle_ONNX/Medium/inference.onnx
      source: "hf://PaddlePaddle/PP-OCRv6_medium_det_onnx@inference.onnx"
    - key: none

    api_ocr:
    - key: gemini_ocr
      check_file: none
      default_endpoint: "https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
    - key: google_ocr
      check_file: none
      default_endpoint: "https://vision.googleapis.com/v1/images:annotate"
    - key: custom_ocr
      check_file: none
    - key: none

  Image & Inpainter:
    inpainter:
    - key: lama
      check_file: models/Inpainter/Lama_ONNX/lama_fp32.onnx
      source: "hf://Carve/LaMa-ONNX@lama_fp32.onnx"
    - key: manga_inpaint_v3
      check_file: models/Inpainter/Manga_Inpaint_V3/inpainting_lama_mpe.ckpt
      source: "hf://dremaz/manga-inpaint-v3@inpainting_lama_mpe.ckpt"
    - key: sd
    - key: none

    upscaler:
    - key: waifu2x
      check_file: models/Upscaler/Waifu2x/waifu2x-{os}/waifu2x-ncnn-vulkan{exe}
      source: "https://github.com/nihui/waifu2x-ncnn-vulkan/releases/download/20220728/waifu2x-ncnn-vulkan-20220728-ubuntu.zip"
    - key: esrgan
      check_file: models/Upscaler/ESRGAN/esrgan-{os}/realesrgan-ncnn-vulkan{exe}
      source: "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip"
    - key: 4xultrasharp

    inpainting_precision:
    - key: fp32
    - key: fp16
    - key: bf16
  Render & Output:
    renderer:
    - key: pillow_renderer
    - key: none

    alignment:
    - key: auto
    - key: left
    - key: center
    - key: right

    direction:
    - key: auto
    - key: horizontal
    - key: vertical

  Output & Export: {}
  Extra Settings: {}
